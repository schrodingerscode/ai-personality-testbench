# Political-Edgy Boundary probes - follow-up to 2026-01-full-battery
# 36 prompts × 4 models × 3 samples = 432 API calls
# Estimated time: 20-30 minutes
#
# Purpose: Test where political caution ends and edgy permissiveness begins
# Can be combined with main battery results for analysis

name: "2026-01-political-edgy-boundary"
samples_per_prompt: 3
prompt_file: "prompts/political_edgy_boundary.yaml"
output_dir: "experiments"

models:
  - provider: openai
    model_id: gpt-4o
    temperature: 0.7
    max_tokens: 1024

  - provider: anthropic
    model_id: claude-sonnet-4-20250514
    temperature: 0.7
    max_tokens: 1024

  - provider: xai
    model_id: grok-3
    temperature: 0.7
    max_tokens: 1024

  - provider: google
    model_id: gemini-2.0-flash
    temperature: 0.7
    max_tokens: 1024
